<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Music Player</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        #player { max-width: 400px; margin: 0 auto; }
        audio { display: none; } /* Hide default controls */
        button { margin: 5px; padding: 10px; }
        input[type="range"] { width: 100%; }
    </style>
</head>
<body>
    <h1>Simple Music Player</h1>
    <div id="player">
        <audio id="audio" controls preload="metadata">
            <!-- Add your tracks here. Example: -->
            <source src="your-song1.mp3" type="audio/mpeg">
            <source src="your-song2.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        
        <div>
            <button id="playPause">Play</button>
            <button id="prev">Previous</button>
            <button id="next">Next</button>
        </div>
        
        <div>
            <input type="range" id="progress" value="0" max="100" step="1">
            <br>
            <input type="range" id="volume" value="50" max="100" step="1">
        </div>
        
        <div id="trackInfo">Track: 1 / 2</div>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const playPauseBtn = document.getElementById('playPause');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');
        const progressBar = document.getElementById('progress');
        const volumeBar = document.getElementById('volume');
        const trackInfo = document.getElementById('trackInfo');
        
        let currentTrack = 0;
        const tracks = [
            'your-song1.mp3', // Replace with your file paths or URLs
            'your-song2.mp3'
        ];
        
        // Load initial track
        audio.src = tracks[currentTrack];
        
        // Play/Pause
        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playPauseBtn.textContent = 'Pause';
            } else {
                audio.pause();
                playPauseBtn.textContent = 'Play';
            }
        });
        
        // Previous track
        prevBtn.addEventListener('click', () => {
            currentTrack = (currentTrack - 1 + tracks.length) % tracks.length;
            loadTrack();
        });
        
        // Next track
        nextBtn.addEventListener('click', () => {
            currentTrack = (currentTrack + 1) % tracks.length;
            loadTrack();
        });
        
        // Load track function
        function loadTrack() {
            audio.src = tracks[currentTrack];
            audio.load();
            trackInfo.textContent = `Track: ${currentTrack + 1} / ${tracks.length}`;
            playPauseBtn.textContent = 'Play';
        }
        
        // Progress bar
        audio.addEventListener('timeupdate', () => {
            const progress = (audio.currentTime / audio.duration) * 100;
            progressBar.value = progress || 0;
        });
        
        progressBar.addEventListener('input', () => {
            audio.currentTime = (progressBar.value / 100) * audio.duration;
        });
        
        // Volume
        volumeBar.addEventListener('input', () => {
            audio.volume = volumeBar.value / 100;
        });
        
        // Auto-next on end
        audio.addEventListener('ended', () => {
            nextBtn.click();
        });
    </script>
</body>
</html>
